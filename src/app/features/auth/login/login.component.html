<div class="login-wrapper">
  
  <div class="login-card">
    <!-- BRAND HEADER -->
    <div class="login-header">
      <div class="login-icon">🌿</div>
      <h2>perfectHousehold</h2>
      <p class="login-subtitle">Witaj w domu! Zaloguj się, aby zarządzać finansami i planami.</p>
    </div>

    <!-- ERROR BANNER -->
    @if (errorMessage()) {
      <div class="error-alert">
        <span class="error-icon">⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- FORM -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="username" class="form-label">Nazwa użytkownika</label>
        <div class="input-with-icon">
          <span class="field-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            [(ngModel)]="credentials.username" 
            placeholder="np. admin, rafal, adrianna" 
            autocomplete="username" 
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Hasło</label>
        <div class="input-with-icon">
          <span class="field-icon">🔒</span>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password" 
            name="password" 
            class="form-control" 
            [(ngModel)]="credentials.password" 
            placeholder="••••••••" 
            autocomplete="current-password" 
            required />
          <button 
            type="button" 
            class="toggle-pass-btn" 
            (click)="toggleShowPassword()" 
            title="Pokaż/ukryj hasło">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block btn-lg" 
        [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span> Logowanie...
        } @else {
          🔑 Zaloguj się do domu
        }
      </button>
    </form>

    <!-- TEST CREDENTIALS CHIP -->
    <div class="demo-seed-box">
      <span class="seed-text">Konto startowe administratora:</span>
      <button type="button" class="seed-chip" (click)="fillAdminCredentials()">
        admin / admin123 <span>(wypełnij)</span>
      </button>
    </div>

    <div class="login-footer">
      <span>Bezpieczne logowanie JWT • perfectHousehold</span>
    </div>

  </div>

</div>
